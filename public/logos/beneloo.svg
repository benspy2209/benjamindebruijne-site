<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C9A84C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8C97A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  

  <!-- Wordmark: B in heavier weight -->
  <text
    x="40"
    y="90"
    font-family="Inter, system-ui, sans-serif"
    font-weight="900"
    font-size="68"
    letter-spacing="-2"
    fill="url(#goldGrad)"
  >B</text>

  <!-- Wordmark: eneloo in light weight -->
  <text
    x="87"
    y="90"
    font-family="Inter, system-ui, sans-serif"
    font-weight="300"
    font-size="68"
    letter-spacing="-1"
    fill="#E8E5DC"
  >eneloo</text>

  <!-- Gold divider line -->
  <rect x="40" y="103" width="440" height="1.5" fill="url(#goldGrad)" opacity="0.7" rx="1"/>

  <!-- Tagline in mono -->
  <text
    x="40"
    y="130"
    font-family="'JetBrains Mono', 'SF Mono', monospace"
    font-weight="400"
    font-size="11"
    letter-spacing="3"
    text-transform="uppercase"
    fill="#C9A84C"
    opacity="0.9"
  >UN CLUB ROYAL MÉRITE D'ÊTRE VU.</text>
</svg>
